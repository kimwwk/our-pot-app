name: Build Android APK (Dev)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: https://our-pot-backend.our-pot-backend-production.workers.dev

      - name: Sync Capacitor
        run: npx cap sync

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/our-pot-${{ steps.version.outputs.version }}-dev.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: our-pot-apk-dev
          path: android/app/build/outputs/apk/debug/our-pot-${{ steps.version.outputs.version }}-dev.apk
